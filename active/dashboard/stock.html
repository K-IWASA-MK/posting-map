<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="チラシ保管状況一覧 — POSTING MAP">
  <title>チラシ保管庫 — POSTING MAP</title>
  <!-- Force Refresh: v422 -->
  <link rel="stylesheet" href="tailwind-utils.css?v=422">
  <link rel="stylesheet" href="./style.css?v=422">
  <link rel="icon" href="./assets/icon180-v2.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#000000] text-white font-sans antialiased" style="min-height: 100dvh;">

  <!-- LOADING STATE -->
  <div id="loading-screen" class="fixed inset-0 z-50 bg-[#000000] flex flex-col items-center justify-center gap-4">
    <div class="w-8 h-8 rounded-full border-2 border-[#2563eb]/30 border-t-[#2563eb] animate-spin"></div>
    <p class="text-[10px] font-black text-white/30 uppercase tracking-[0.4em]">Loading Inventory...</p>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="flex flex-col min-h-[100dvh] opacity-0 transition-opacity duration-500" style="padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);">

    <!-- HEADER -->
    <header class="sticky top-0 z-10 px-4 pt-4 pb-3 bg-[#000000]">
      <div style="background: #1C1C1E; border: 1px solid rgba(255,255,255,0.1); border-radius: 1.8rem; padding: 14px 20px;" class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-[#2563eb]/10 border border-[#2563eb]/20 flex items-center justify-center">
            <span class="text-sm">📦</span>
          </div>
          <div>
            <h1 class="text-xs font-black tracking-tighter text-white leading-none">チラシ保管庫</h1>
            <p class="text-[8px] font-black text-white/30 uppercase tracking-widest mt-0.5">FLYER STOCK INVENTORY</p>
          </div>
        </div>
        <button id="btn-refresh" onclick="loadStock()" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center active:scale-90 transition-transform">
          <svg class="w-4 h-4 text-white/60" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
      </div>
    </header>

    <!-- SUMMARY BADGE -->
    <div class="px-4 pt-2 pb-2">
      <div id="summary-badge" style="background: rgba(37,99,235,0.06); border: 1px solid rgba(37,99,235,0.2); border-radius: 1rem; padding: 10px 16px;" class="flex items-center justify-between hidden">
        <span class="text-[10px] font-black text-white/50 uppercase tracking-widest">総保管枚数</span>
        <span id="total-count" class="text-base font-black text-[#2563eb] font-mono">0枚</span>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 px-4 pt-2 pb-8 space-y-4">
      <div id="stock-container" class="space-y-4">
        <!-- Dynamically populated -->
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="px-4 pb-6">
      <p id="last-updated" class="text-center text-[9px] font-black text-white/20 uppercase tracking-widest"></p>
    </footer>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgiOFU5iudUS6UscNU-MZhnxZJaqJHywVA9ivA-GE0uLe02fi7mmBU474lWa1TD7-R/exec";

    async function loadStock() {
      const container = document.getElementById('stock-container');
      const loadingScreen = document.getElementById('loading-screen');
      const app = document.getElementById('app');
      const summaryBadge = document.getElementById('summary-badge');
      const totalCountEl = document.getElementById('total-count');
      const lastUpdatedEl = document.getElementById('last-updated');
      const refreshBtn = document.getElementById('btn-refresh');

      // Show loading spinner in container (after first load)
      if (!loadingScreen.classList.contains('hidden')) {
        // First load: full-screen loading
      } else {
        // Refresh: inline spinner
        container.innerHTML = `
          <div style="border: 1px solid rgba(255,255,255,0.04);" class="premium-glass p-10 flex flex-col items-center justify-center text-center gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-[#2563eb]/40 border-t-[#2563eb] animate-spin"></div>
            <p class="text-[10px] font-black text-white/40 uppercase tracking-[0.3em]">更新中...</p>
          </div>`;
        summaryBadge.classList.add('hidden');
      }

      if (refreshBtn) {
        refreshBtn.querySelector('svg').classList.add('animate-spin');
      }

      try {
        const url = `${API_URL}?action=getFlyerStock&_t=${Date.now()}`;
        const res = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store', redirect: 'follow' });
        const data = await res.json();

        if (!data || !data.success || !Array.isArray(data.stocks)) {
          throw new Error('Invalid response');
        }

        const stocks = data.stocks;

        // Update summary
        const total = stocks.reduce((sum, s) => sum + (parseFloat(s.count) || 0), 0);
        if (stocks.length > 0) {
          totalCountEl.textContent = total.toLocaleString() + '枚';
          summaryBadge.classList.remove('hidden');
        }

        // Render
        renderStock(stocks, container);

        // Update timestamp
        const now = new Date();
        lastUpdatedEl.textContent = `最終更新: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      } catch (err) {
        console.error('Stock load error:', err);
        container.innerHTML = `
          <div style="border: 1px solid rgba(255,255,255,0.04);" class="premium-glass p-10 flex flex-col items-center justify-center text-center gap-4">
            <span class="text-3xl">⚠️</span>
            <p class="text-sm font-black text-white/60">データの取得に失敗しました</p>
            <button onclick="loadStock()" class="mt-2 h-10 px-6 rounded-xl bg-[#2563eb] text-white text-xs font-black active:scale-95 transition-transform">再読み込み</button>
          </div>`;
      } finally {
        // Hide full-screen loading, show app
        loadingScreen.classList.add('hidden');
        app.style.opacity = '1';
        if (refreshBtn) {
          refreshBtn.querySelector('svg').classList.remove('animate-spin');
        }
      }
    }

    function renderStock(stocks, container) {
      if (!stocks || stocks.length === 0) {
        container.innerHTML = `
          <div style="border: 1px solid rgba(255,255,255,0.04);" class="premium-glass p-12 flex flex-col items-center justify-center text-center gap-4">
            <span class="text-4xl">📦</span>
            <p class="text-sm font-black text-white/50">現在、保管されているチラシはありません</p>
          </div>`;
        return;
      }

      // Group by location
      const groups = {};
      stocks.forEach(s => {
        const loc = s.location || 'その他';
        if (!groups[loc]) groups[loc] = [];
        groups[loc].push(s);
      });

      const sortedLocations = Object.keys(groups).sort();
      let html = '';

      sortedLocations.forEach(loc => {
        const list = groups[loc];
        const locTotal = list.reduce((sum, s) => sum + (parseFloat(s.count) || 0), 0);

        const rowsHtml = list.map(s => {
          const lineMsg = encodeURIComponent(`【チラシ受渡のお願い】\n${s.staffName}さんの保管チラシ（${s.location} ${Number(s.count).toLocaleString()}枚）を一部分けていただけないでしょうか？`);
          const lineUrl = `https://line.me/R/share?text=${lineMsg}`;
          return `
            <div class="flex justify-between items-center py-3.5 border-b border-white/5 last:border-b-0">
              <div class="min-w-0 flex-1 pr-3">
                <div class="text-sm font-black text-white truncate">${escapeHtml(s.staffName || '---')}</div>
                <div class="text-[9px] text-white/30 font-mono mt-0.5">${escapeHtml(s.staffId || '')} · ${escapeHtml(s.updatedAt || '---')}</div>
              </div>
              <div class="flex items-center gap-3 shrink-0">
                <span class="text-base font-black text-[#22c55e] font-mono whitespace-nowrap">${Number(s.count || 0).toLocaleString()}枚</span>
                <a href="${lineUrl}" target="_blank" class="h-9 px-4 rounded-xl bg-[#2563eb] text-white text-xs font-black flex items-center justify-center gap-1 shadow-md active:scale-95 transition-transform">
                  <span>💬</span> LINE
                </a>
              </div>
            </div>`;
        }).join('');

        html += `
          <div class="premium-glass p-6 space-y-1">
            <div class="flex justify-between items-center pb-3 border-b border-white/10 mb-2">
              <div>
                <span class="text-sm font-black text-white tracking-wide">${escapeHtml(loc)}</span>
                <span class="text-[9px] font-black text-white/30 ml-2 font-mono">${list.length}名</span>
              </div>
              <span style="background: rgba(37,99,235,0.1); color: #2563eb;" class="text-xs font-black px-3 py-1 rounded-full font-mono">${locTotal.toLocaleString()}枚</span>
            </div>
            <div>${rowsHtml}</div>
          </div>`;
      });

      container.innerHTML = html;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Auto-load on page open
    loadStock();
  </script>
</body>
</html>
