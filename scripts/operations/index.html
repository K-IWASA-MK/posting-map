<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSTING MAP - Operations Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            black: '#000000'
          },
          fontFamily: {
            sans: ['Outfit', 'Noto Sans JP', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
    }
    .glass-card {
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));
      box-shadow: inset 0 0 0 1px rgba(120,140,255,0.08), 0 0 30px rgba(37,99,235,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .text-secondary {
      color: rgba(255, 255, 255, 0.72);
    }
    .border-default {
      border-color: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden antialiased">
  <!-- Loading overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-[#000000]/90 backdrop-blur-md flex flex-col items-center justify-center z-[10000] transition-opacity duration-300">
    <div class="w-10 h-10 border-2 border-white/20 border-t-primary rounded-full animate-spin"></div>
  </div>

  <!-- Gateway Screen (Auth Mock UI Only) -->
  <div id="auth-screen" class="hidden fixed inset-0 bg-[#000000] flex flex-col items-center justify-center p-6 text-center z-[1000]">
    <div class="glass-card max-w-sm w-full p-8 transition-transform duration-300 scale-95 hover:scale-100">
      <div class="w-16 h-16 rounded-2xl bg-primary/10 border border-primary/20 flex items-center justify-center mx-auto mb-6 text-2xl">
        ⚙️
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight mb-2">POSTING MAP</h2>
      <p class="text-sm text-secondary mb-8">Operations Console</p>
      <button onclick="handleOperationsLogin()" class="w-full bg-primary hover:bg-primary/95 text-white rounded-full py-4 text-sm font-bold shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
        運営コンソールに接続
      </button>
    </div>
  </div>

  <!-- Operations Dashboard App Shell -->
  <div id="operations-app" class="hidden min-h-screen flex flex-col p-6 max-w-4xl mx-auto w-full space-y-8">
    <header class="flex justify-between items-center py-4 border-b border-default">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tighter">POSTING MAP Operations</h1>
        <p class="text-[9px] font-bold text-primary uppercase tracking-widest mt-1">Subscription Overview</p>
      </div>
      <button onclick="logout()" class="text-xs font-bold text-secondary hover:text-white border border-default rounded-full px-4 py-2 hover:bg-white/5 transition-all">
        切断
      </button>
    </header>

    <!-- KPI Section -->
    <main class="space-y-6 flex-1">
      <div class="grid grid-cols-3 gap-4">
        <div class="glass-card p-5 flex flex-col justify-center">
          <span class="text-[9px] font-bold text-secondary uppercase tracking-widest mb-1">契約中</span>
          <span class="text-2xl font-extrabold text-emerald-400" id="kpi-active-count">0支部</span>
        </div>
        <div class="glass-card p-5 flex flex-col justify-center">
          <span class="text-[9px] font-bold text-secondary uppercase tracking-widest mb-1">利用停止中</span>
          <span class="text-2xl font-extrabold text-red-400" id="kpi-suspended-count">0支部</span>
        </div>
        <div class="glass-card p-5 flex flex-col justify-center">
          <span class="text-[9px] font-bold text-secondary uppercase tracking-widest mb-1">期限間近 (7日以内)</span>
          <span class="text-2xl font-extrabold text-amber-400" id="kpi-warning-count">0支部</span>
        </div>
      </div>

      <!-- Workspace Onboarding Card -->
      <section class="glass-card p-6 space-y-4">
        <h3 class="text-sm font-bold tracking-tight">新規ワークスペース導入 (Onboarding)</h3>
        <form id="onboarding-form" onsubmit="handleOnboarding(event)" class="space-y-4">
          <div class="flex flex-col space-y-2">
            <label for="onboard-name-input" class="text-xs text-secondary font-bold uppercase tracking-wider">支部名 (新規作成)</label>
            <div class="flex gap-3">
              <input type="text" id="onboard-name-input" placeholder="例: 三重県 第4支部" required class="bg-white/5 border border-default rounded-full px-4 py-2 text-sm text-white focus:outline-none focus:border-primary flex-1">
              <button type="submit" class="bg-primary hover:bg-primary/95 text-white text-xs font-bold rounded-full px-6 py-2 transition-all">作成</button>
            </div>
          </div>
        </form>

        <!-- Result Box -->
        <div id="onboarding-result" class="hidden border border-emerald-400/20 bg-emerald-400/5 rounded-2xl p-4 space-y-3">
          <p class="text-xs font-bold text-emerald-400">✓ Workspace Created</p>
          <div class="grid grid-cols-1 gap-2 text-xs font-mono text-white">
            <div class="flex justify-between items-center py-1 border-b border-default">
              <span class="text-secondary uppercase tracking-widest text-[9px]">Workspace ID</span>
              <span id="result-id" class="font-bold text-emerald-400">-</span>
            </div>
            <div class="flex flex-col py-1 border-b border-default">
              <span class="text-secondary uppercase tracking-widest text-[9px] mb-1">LINE URL</span>
              <a id="result-line" href="#" target="_blank" class="text-primary hover:underline break-all">-</a>
            </div>
            <div class="flex flex-col py-1">
              <span class="text-secondary uppercase tracking-widest text-[9px] mb-1">Dashboard URL</span>
              <a id="result-dashboard" href="#" target="_blank" class="text-primary hover:underline break-all">-</a>
            </div>
          </div>
        </div>
      </section>

      <!-- Search Box -->
      <div class="glass-card p-4 flex gap-4 items-center">
        <span class="text-lg">🔍</span>
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="Workspace ID または 支部名で検索..." class="bg-transparent text-sm w-full outline-none text-white placeholder-white/30">
      </div>

      <!-- Workspaces Table / List -->
      <section class="glass-card p-6 space-y-4">
        <h3 class="text-sm font-bold tracking-tight">支部契約一覧</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-secondary">
            <thead>
              <tr class="border-b border-default text-[9px] uppercase tracking-widest text-white">
                <th class="py-3 px-2">Workspace ID</th>
                <th class="py-3 px-2">支部名</th>
                <th class="py-3 px-2">契約ステータス</th>
                <th class="py-3 px-2">有効期限</th>
                <th class="py-3 px-2 text-right">残り日数</th>
              </tr>
            </thead>
            <tbody id="workspaces-table-body" class="divide-y divide-default">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-[9px] font-bold text-secondary uppercase tracking-widest border-t border-default">
      Operational Environment (Operations Only)
    </footer>
  </div>

  <script src="manager.js"></script>
</body>
</html>
