<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSTING MAP 管制コックピット</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/active/dashboard/config.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#EA5F08',
            brandLight: '#fb923c',
            brandDark: '#c2410c',
            brandBlue: '#00B7FF',
            brandGreen: '#22C55E',
            appBg: '#0B1019',
            containerBg: '#131A26',
            cardBg: '#182130',
            cardSubBg: '#1F2B3E',
            borderNormal: '#243044',
            borderHighlight: '#33435C',
            textMain: '#E6ECF3',
            textSub: '#94A3B8',
            statusGreen: '#22C55E',
            statusYellow: '#F59E0B',
            statusRed: '#EF4444'
          },
          fontFamily: {
            sans: ['Outfit', 'Noto Sans JP', 'sans-serif'],
            mono: ['Outfit', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0B1019;
      color: #E6ECF3;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: #243044;
      border-radius: 2px;
    }

    /* Posting Map Card */
    .pm-card {
      background: #131A26;
      border: 1px solid #243044;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pm-card:hover {
      border-color: #33435C;
    }

    /* Leaflet Dark Theme Adjustments */
    .leaflet-container {
      background-color: #cbd5e1 !important;
      font-family: inherit;
    }
    .leaflet-popup-content-wrapper {
      background: rgba(19, 26, 38, 0.95) !important;
      color: #E6ECF3 !important;
      border: 1px solid #243044 !important;
      border-radius: 10px !important;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
    }
    .leaflet-popup-tip {
      background: rgba(19, 26, 38, 0.95) !important;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Left Nav Smooth Item & Clean Selection (No Neon Glow) */
    .nav-item {
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-item-active {
      background-color: rgba(234, 95, 8, 0.12) !important;
      color: #EA5F08 !important;
      border-color: rgba(234, 95, 8, 0.35) !important;
    }

    /* Dark-tone filter for Leaflet map tiles (Contrast Alignment) */
    .leaflet-tile-pane img {
      filter: brightness(0.78) saturate(0.72) contrast(1.05);
    }

    /* LIVE feed smooth slide-in */
    @keyframes liveSlideIn {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .live-card-new {
      animation: liveSlideIn 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-appBg text-textMain h-screen h-[100dvh] w-screen overflow-hidden flex antialiased">

  <!-- ==================== LEFT SIDEBAR (NAV & SYSTEM LINE) ==================== -->
  <aside class="w-56 bg-containerBg border-r border-borderNormal p-3 flex flex-col justify-between flex-shrink-0 z-20">

    <!-- Top: Branding (公式ロゴ: 大型正円) -->
    <div>
      <div class="flex flex-col items-center justify-center pt-2 pb-3">
        <div class="w-[120px] h-[120px] rounded-full overflow-hidden border border-white/10 bg-white flex items-center justify-center p-1">
          <img src="/active/dashboard/assets/icon180-v2.png" alt="POSTING MAP" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- 自治体セレクター (SSOTから動的生成) -->
      <div class="mt-3">
        <select id="city-selector" onchange="onCitySelected(this.value)" class="w-full h-10 bg-[#0B1019] text-white border border-borderNormal hover:border-brand/50 rounded-xl px-3 text-sm font-semibold focus:outline-none focus:border-brand cursor-pointer transition-colors shadow-inner text-center">
          <option value="ALL">全域</option>
        </select>
      </div>

      <!-- Navigation Menu (枠線付きの1つのブロックに統合) -->
      <nav class="space-y-1 mt-3 p-1.5 rounded-2xl bg-[#0B1019]/80 border border-borderNormal">
        <button id="nav-areas" onclick="switchView('areas')" class="nav-item nav-item-active w-full h-10 flex items-center gap-2.5 px-3 rounded-xl border border-brand/35 text-brand font-semibold text-left">
          <span class="w-5 text-base flex items-center justify-center flex-shrink-0">🗺️</span>
          <span class="text-sm">配布エリア</span>
        </button>
        <button id="nav-records" onclick="switchView('records')" class="nav-item w-full h-10 flex items-center gap-2.5 px-3 rounded-xl text-textSub border border-transparent hover:text-white hover:bg-white/5 text-left font-medium">
          <span class="w-5 text-base flex items-center justify-center flex-shrink-0">📝</span>
          <span class="text-sm">配布実績</span>
        </button>
        <button id="nav-stocks" onclick="switchView('stocks')" class="nav-item w-full h-10 flex items-center gap-2.5 px-3 rounded-xl text-textSub border border-transparent hover:text-white hover:bg-white/5 text-left font-medium">
          <span class="w-5 text-base flex items-center justify-center flex-shrink-0">📦</span>
          <span class="text-sm">保有チラシ</span>
        </button>
        <button id="nav-roster" onclick="switchView('roster')" class="nav-item w-full h-10 flex items-center gap-2.5 px-3 rounded-xl text-textSub border border-transparent hover:text-white hover:bg-white/5 text-left font-medium">
          <span class="w-5 text-base flex items-center justify-center flex-shrink-0">📋</span>
          <span class="text-sm">名簿</span>
        </button>
        <button id="nav-requests" onclick="switchView('requests')" class="nav-item w-full h-10 flex items-center gap-2.5 px-3 rounded-xl text-textSub border border-transparent hover:text-white hover:bg-white/5 text-left font-medium">
          <span class="w-5 text-base flex items-center justify-center flex-shrink-0">🤝</span>
          <span class="text-sm">受渡要請</span>
        </button>
      </nav>
    </div>

    <!-- Bottom: 常時監視ステータスライン -->
    <div class="pt-2 border-t border-borderNormal">
      <!-- Live Sync Status Line -->
      <div class="px-2.5 py-1.5 rounded-lg bg-[#0B1019]/60 border border-borderNormal/50 text-[11px]">
        <div class="flex items-center gap-1.5">
          <span id="live-dot" class="w-2 h-2 rounded-full bg-statusGreen"></span>
          <span id="live-status-text" class="font-medium text-white/90">現場データ同期</span>
        </div>
        <div class="flex items-center justify-between text-textSub/70 mt-1 text-[10px] font-mono">
          <span>最終同期</span>
          <span id="sync-clock">--:--:--</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ==================== MAIN CONTROL CANVAS (管制メインキャンバス) ==================== -->
  <main class="flex-1 flex flex-col p-2.5 gap-2 overflow-hidden bg-appBg min-w-0">

    <!-- ========== ① 統括状況 BAR (単一の統合計器ライン) ========== -->
    <div id="situation-bar" class="h-11 flex-shrink-0 flex items-center justify-between px-3 bg-containerBg border border-borderNormal rounded-xl overflow-hidden">

      <!-- Left: 配布状況進捗 -->
      <div class="flex items-center gap-2.5 flex-shrink-0">
        <span class="text-[11px] font-medium text-textSub tracking-wider uppercase">配布状況</span>
        <div class="flex items-baseline gap-1">
          <span id="fact-done-areas" class="text-2xl font-bold font-mono text-white leading-none tracking-tight">--</span>
          <span class="text-xs text-textSub font-mono font-normal">/ <span id="fact-total-areas">858</span></span>
        </div>
        <span id="fact-progress-badge" class="px-2 py-0.5 rounded text-xs font-mono font-bold bg-brand/15 text-brand border border-brand/30">
          --%
        </span>
      </div>

      <!-- Mid-Left: 内訳インジケーター (未/中/済) -->
      <div class="hidden md:flex items-center gap-3 px-3 py-1 rounded-lg bg-[#0B1019]/50 border border-borderNormal/40 text-xs flex-shrink-0 font-mono">
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-statusGreen"></span>
          <span class="text-textSub font-normal">未</span>
          <span id="fact-unallocated-areas" class="font-semibold text-white">--</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-brandBlue"></span>
          <span class="text-textSub font-normal">中</span>
          <span id="fact-inprogress-areas" class="font-semibold text-white">--</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-brand"></span>
          <span class="text-textSub font-normal">済</span>
          <span id="fact-completed-areas" class="font-semibold text-white">--</span>
        </div>
      </div>

      <!-- Right: リソース残量 (在庫) -->
      <div class="flex items-center gap-2 flex-shrink-0 text-xs pr-1">
        <div class="flex items-center gap-1.5">
          <span class="text-xs opacity-70">📦</span>
          <span class="text-[11px] font-medium text-textSub">在庫</span>
          <span id="fact-total-stocks" class="font-mono font-bold text-white text-lg leading-none">--</span>
          <span class="text-[11px] font-normal text-textSub">枚</span>
        </div>
      </div>

    </div>

    <!-- ========== ② & ③ MAIN COCKPIT BODY (中央MAIN STAGE ＆ 右側判断パネル) ========== -->
    <div id="default-view-grid" class="flex-1 flex gap-2 min-h-0 overflow-hidden">

      <!-- ===== ② CENTER: MAIN STAGE 【ここだけが切り替わる排他的ビュー】 ===== -->
      <div id="main-stage-container" class="flex-1 flex flex-col pm-card p-2 relative overflow-hidden min-w-0">

        <!-- 1. 配布エリア MAP ビュー (areas) -->
        <div id="main-view-areas" class="flex-1 flex flex-col min-h-0">
          <!-- マップ上部バー -->
          <div class="flex items-center justify-between px-2 py-1 flex-shrink-0 z-10">
            <div class="flex items-center gap-2">
              <span class="font-black text-sm text-white tracking-wide">配布エリア MAP</span>
              <span id="map-district-label" class="text-xs font-mono text-brand font-bold">全域</span>
            </div>
          </div>

          <!-- Leaflet Map Canvas (最大面積確保) -->
          <div class="flex-1 w-full rounded-lg overflow-hidden relative border border-borderNormal mt-1">
            <div id="map" class="w-full h-full"></div>

            <!-- マップ上ピンタップ時の詳細オーバーレイ -->
            <div id="map-area-detail" class="absolute bottom-3 left-3 min-w-[200px] max-w-[280px] w-auto p-2.5 rounded-xl bg-containerBg/95 border border-borderHighlight backdrop-blur-md z-[1000] hidden transition-all shadow-2xl">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div id="selected-area-name" class="font-bold text-xs text-white">--</div>
                  <div class="text-[11px] text-textSub mt-0.5">
                    状態: <span id="selected-area-status" class="font-mono font-bold">--</span>
                  </div>
                </div>
                <button onclick="closeAreaDetail()" class="text-textSub hover:text-white px-2 py-1 text-xs flex-shrink-0">✕</button>
              </div>
            </div>
          </div>

          <!-- 地図内フッター: 状態凡例バー -->
          <div class="flex items-center justify-between px-2 pt-1.5 flex-shrink-0 text-[10px] text-textSub font-medium">
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-statusGreen"></span>
                <span>未配布エリア</span>
              </div>
              <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-brandBlue"></span>
                <span>配布中エリア</span>
              </div>
              <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-brand"></span>
                <span>完了エリア</span>
              </div>
            </div>
            <div class="text-[9px] text-textSub/60 font-mono">
              858マスターピン連動
            </div>
          </div>
        </div>

        <!-- 2. 配布実績 ビュー (records) -->
        <!-- 2. 配布実績 ビュー (records) -->
        <div id="main-view-records" class="flex-1 flex flex-col min-h-0 p-2.5 hidden">
          <div class="flex items-center gap-2 pb-2 border-b border-borderNormal flex-shrink-0">
            <span class="text-base">🏆</span>
            <span class="font-bold text-sm text-white tracking-wide">配布実績 ランキング一覧</span>
          </div>
          <div id="main-stage-records-content" class="flex-1 overflow-y-auto pt-2 space-y-1.5 pr-1">
            <!-- 動的レンダリング -->
          </div>
        </div>

        <!-- 3. 保有チラシ ビュー (stocks) -->
        <div id="main-view-stocks" class="flex-1 flex flex-col min-h-0 p-2.5 hidden">
          <div class="flex items-center gap-2 pb-2 border-b border-borderNormal flex-shrink-0">
            <span class="text-base">📦</span>
            <span class="font-bold text-sm text-white tracking-wide">保有チラシ 拠点別一覧</span>
          </div>
          <div id="main-stage-stocks-content" class="flex-1 overflow-y-auto pt-2 space-y-1.5 pr-1">
            <!-- 動的レンダリング -->
          </div>
        </div>

        <!-- 4. 名簿 ビュー (roster) -->
        <div id="main-view-roster" class="flex-1 flex flex-col min-h-0 p-2.5 hidden">
          <div class="flex items-center gap-2 pb-2 border-b border-borderNormal flex-shrink-0">
            <span class="text-base">📋</span>
            <span class="font-bold text-sm text-white tracking-wide">登録配布員 名簿一覧</span>
          </div>
          <div id="main-stage-roster-content" class="flex-1 overflow-y-auto pt-2 space-y-1.5 pr-1">
            <!-- 動的レンダリング -->
          </div>
        </div>

        <!-- 5. 受渡要請 ビュー (requests) -->
        <div id="main-view-requests" class="flex-1 flex flex-col min-h-0 p-2.5 hidden">
          <div class="flex items-center gap-2 pb-2 border-b border-borderNormal flex-shrink-0">
            <span class="text-base">🤝</span>
            <span class="font-bold text-sm text-white tracking-wide">チラシ受渡要請 一覧</span>
          </div>
          <div id="main-stage-requests-content" class="flex-1 overflow-y-auto pt-2 space-y-1.5 pr-1">
            <!-- 動的レンダリング -->
          </div>
        </div>

      </div>

      <!-- ===== ③ RIGHT: 現場判断パネル (右側2枠: 将来拡張用空枠) 【常時固定】 ===== -->
      <div class="w-72 sm:w-80 flex-shrink-0 flex flex-col gap-2 min-h-0 overflow-hidden">

        <!-- 上段スロット (空枠) -->
        <div id="right-slot-top" class="flex-1 pm-card p-3 flex flex-col justify-between overflow-hidden">
        </div>

        <!-- 下段スロット (空枠) -->
        <div id="right-slot-bottom" class="flex-1 pm-card p-3 flex flex-col justify-between overflow-hidden">
        </div>

      </div>

    </div>

    <!-- ========== ④ LIVE (最新配布実績フィード: 常時最新3件固定) 【常時固定】 ========== -->
    <div id="live-feed-bar" class="h-9 pm-card px-3 flex items-center justify-between flex-shrink-0 overflow-hidden">
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="w-2.5 h-2.5 rounded-full bg-statusGreen animate-pulse"></span>
        <span class="font-bold text-xs text-white tracking-wider uppercase whitespace-nowrap">LIVE</span>
      </div>

      <div class="h-4 w-px bg-borderNormal mx-2.5 flex-shrink-0"></div>

      <!-- 常時3件固定スライディングウィンドウ -->
      <div id="live-feed-container" class="flex-1 flex items-center gap-2.5 overflow-hidden px-1 min-w-0">
        <div class="text-[11px] text-textSub/50">Backend配布実績データ読み込み中...</div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      var s = document.createElement('script');
      s.src = 'manager.js?_t=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
