<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSTING MAP - Branch Live Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="/active/dashboard/config.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#EA5F08',
            primary: '#2563eb',
            surface: '#080c14',
            card: 'rgba(255, 255, 255, 0.03)'
          },
          fontFamily: {
            sans: ['Outfit', 'Noto Sans JP', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #030508;
      color: #ffffff;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .glass-card.updated-flash {
      border-color: rgba(34, 197, 94, 0.6);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
    }

    .glow-orange {
      text-shadow: 0 0 25px rgba(234, 95, 8, 0.6);
    }

    .glow-green {
      box-shadow: 0 0 12px #22c55e;
    }

    .glow-red {
      box-shadow: 0 0 12px #ef4444;
    }

    /* Smooth Progress Bar Transition */
    .progress-bar-fill {
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Ambient Background Grid */
    .ambient-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="p-4 sm:p-6 lg:p-8 flex flex-col justify-between relative antialiased">
  <div class="ambient-grid"></div>

  <div class="max-w-3xl mx-auto w-full space-y-6 relative z-10">

    <!-- 1. HEADER (Branch Name, LIVE Pulse, Last Sync) -->
    <header class="glass-card p-5 sm:p-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#EA5F08] to-[#ff8c42] flex items-center justify-center font-black text-white text-lg shadow-[0_0_20px_rgba(234,95,8,0.4)]">
          P
        </div>
        <div>
          <h1 id="branch-title" class="text-xl sm:text-2xl font-black tracking-tight text-white">三重県第3区</h1>
          <p class="text-[9px] font-mono font-bold text-white/40 uppercase tracking-widest mt-0.5">POSTING MAP Field Dashboard</p>
        </div>
      </div>

      <div class="flex items-center gap-3 text-right">
        <div>
          <div id="live-indicator-wrapper" class="flex items-center justify-end gap-2">
            <span id="live-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 glow-green animate-pulse"></span>
            <span id="live-text" class="text-xs font-black tracking-widest text-emerald-400">LIVE</span>
          </div>
          <div id="sync-time" class="text-[11px] font-mono text-white/50 tracking-wider mt-0.5">同期中...</div>
        </div>
      </div>
    </header>

    <!-- 2. KPI MAIN CARD (Large Percentage & Pin Count) -->
    <section id="kpi-card" class="glass-card p-8 text-center relative overflow-hidden">
      <div class="text-[11px] font-mono uppercase tracking-[0.25em] text-white/40 mb-2 font-bold">
        Overall Completion Rate
      </div>
      <div id="kpi-percent" class="text-6xl sm:text-7xl font-black tracking-tighter text-white glow-orange my-2">
        0<span class="text-3xl sm:text-4xl text-white/60 font-bold ml-1">%</span>
      </div>
      <div class="flex items-center justify-center gap-2 text-sm sm:text-base text-white/70 font-mono mt-3">
        <span id="kpi-done-pins" class="font-black text-emerald-400 text-lg sm:text-xl">0</span>
        <span class="text-white/30">/</span>
        <span id="kpi-total-pins" class="font-bold text-white/70">858</span>
        <span class="text-xs text-white/40 ml-1">PINS COMPLETED</span>
      </div>
    </section>

    <!-- 3. MUNICIPALITY PROGRESS (City Breakdown Bars) -->
    <section class="glass-card p-6 sm:p-7 space-y-5">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h2 class="text-xs font-black uppercase tracking-[0.2em] text-white/70">自治体別進捗</h2>
        <span id="municipality-summary-count" class="text-[10px] font-mono text-white/40">8 自治体</span>
      </div>

      <div id="municipality-list" class="space-y-4">
        <!-- Dynamically rendered city progress bars -->
        <div class="animate-pulse space-y-3">
          <div class="h-4 bg-white/5 rounded-full w-full"></div>
          <div class="h-4 bg-white/5 rounded-full w-4/5"></div>
          <div class="h-4 bg-white/5 rounded-full w-3/4"></div>
        </div>
      </div>
    </section>

    <!-- 4. JUST UPDATED (Live Diff Indicator) -->
    <section id="just-updated-card" class="glass-card p-5 sm:p-6 border-white/10 relative overflow-hidden transition-all duration-500">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-emerald-400/10 border border-emerald-400/30 flex items-center justify-center text-sm">
            ⚡
          </div>
          <div>
            <div class="text-[10px] font-mono font-black uppercase tracking-widest text-emerald-400">JUST UPDATED</div>
            <div id="updated-area-text" class="text-sm font-bold text-white mt-0.5">現場データと完全に同期しています</div>
          </div>
        </div>
        <div id="updated-time-text" class="text-[11px] font-mono text-white/40">
          --:--
        </div>
      </div>
    </section>

    <!-- 5. FLYER STOCK (Current Inventory by Location) -->
    <section class="glass-card p-6 sm:p-7 space-y-5">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h2 class="text-xs font-black uppercase tracking-[0.2em] text-white/70">チラシ在庫</h2>
        <div class="text-xs font-mono font-bold text-brand">
          合計: <span id="total-flyer-stock">0</span> 枚
        </div>
      </div>

      <div id="stock-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Dynamically rendered stock items -->
        <div class="text-xs text-white/30 font-mono py-2">在庫情報を取得中...</div>
      </div>
    </section>

    <!-- FOOTER (Read-Only Status) -->
    <footer class="text-center py-6 text-[10px] font-mono text-white/30 tracking-widest uppercase">
      POSTING MAP · FIELD OPERATIONS PLATFORM (READ-ONLY)
    </footer>

  </div>

  <script src="manager.js"></script>
</body>
</html>
