<script type="text/javascript">
function buildLiffFullUrl(originalUrl, fullUrl) {
    const hash = location.hash;
    if (hash) {
        const liffState = "?client=MIE-03";
        const liffStateWithHash = liffState + hash;

        const fullUrlWithHash = new URL(originalUrl);
        fullUrlWithHash.searchParams.append("liff.state", liffStateWithHash)

        const liffReferrer = "";
        if (liffReferrer !== "") {
            fullUrlWithHash.searchParams.append("liff.referrer", liffReferrer)
        }

        const liffSource = "";
        if (liffSource !== "") {
            fullUrlWithHash.searchParams.append("liff.source", liffSource)
        }

        return fullUrlWithHash.href;
    } else {
        return fullUrl;
    }
}
</script>

    <script type="text/javascript">
        redirectToTargetPage();

        function redirectToTargetPage() {
            const liffEndpointUrl = "https://k-iwasa-mk.github.io/posting-map/"
            let liffFullUrlForBrowser = "https://k-iwasa-mk.github.io/posting-map/?liff.state=%3Fclient%3DMIE-03"
            liffFullUrlForBrowser = buildLiffFullUrl(liffEndpointUrl, liffFullUrlForBrowser)
            window.location.href = liffFullUrlForBrowser
        }
    </script>
